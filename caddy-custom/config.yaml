name: Caddy Custom
version: 57c94c3
slug: caddy-custom
description: Customizable Caddy server
url: https://github.com/datf/hassio-caddy-custom
arch:
- amd64
- aarch64
startup: services
host_network: true
map:
- addon_config:rw
- ssl:rw
- share
options:
  args: []
  env_vars: []
  plugins: []
  update_check_interval: 24
  log_level: info
schema:
  plugins:
  - match(^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(:\d+)?/[^\s@=]+(@[^\s=]+)?(=[^\s]+)?$)
  args:
  - str
  env_vars:
  - name: str
    value: str
  update_check_interval: int(0,)
  log_level: list(trace|debug|info|notice|warning|error|fatal)
environment:
  LOG_FORMAT: '{LEVEL}: {MESSAGE}'
init: false
image: ghcr.io/datf/caddy-custom
